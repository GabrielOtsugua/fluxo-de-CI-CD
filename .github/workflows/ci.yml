name: CI - Lint Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Markdown Lint Check
        uses: markdownlint/markdownlint-github-action@v2
        with:
          args: 'README.md'
          
